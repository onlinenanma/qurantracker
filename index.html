<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <!-- PWA Manifest & Browser Theme Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0d3322">
  
  <!-- Standard Web App Capable Tag -->
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- iOS Safari Compatibility Tags -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quran Learning App">
  <link rel="apple-touch-icon" href="./icon-192.png">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Quran Learning App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-quran { font-family: 'Amiri', serif; }
    /* Dark Green Custom Theme Variables */
    .bg-dark-emerald { background-color: #0d3322; }
    .bg-dark-emerald-light { background-color: #133e2b; }
    .border-dark-emerald { border-color: #1b5239; }
    /* clip (not hidden) keeps the off-canvas sidebar hidden without breaking position:sticky */
    .clip-x { overflow: clip; }
    .active-verse {
      border-color: #059669 !important;
      background-color: #f0fdf4 !important;
      box-shadow: 0 4px 18px rgba(5, 150, 105, 0.25);
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- Always Visible Top Header -->
  <header class="bg-dark-emerald text-emerald-50 px-4 py-3 border-b border-emerald-950 z-30 shadow-md sticky top-0">
    <div class="max-w-[1600px] mx-auto flex flex-wrap items-center justify-between gap-2">
      
      <!-- Branding & Title -->
      <div class="flex items-center space-x-2.5">
        <div class="bg-dark-emerald-light p-2 rounded-xl text-emerald-300 border border-emerald-800/40 shrink-0">
          <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
        </div>
        <div>
          <h1 id="brandTitle" class="font-bold text-sm sm:text-base leading-tight text-white">Quran Learning App</h1>
          <p id="brandSub" class="text-[11px] text-emerald-300 font-medium"> تطبيق حفظ القرآن</p>
        </div>
      </div>

      <!-- Controls Right: Date Badge & Language Selector -->
      <div class="flex items-center flex-wrap gap-2 justify-end">
        <span class="bg-emerald-950/80 text-emerald-200 border border-emerald-700/60 text-xs font-semibold px-2.5 py-1 rounded-lg shadow-sm whitespace-nowrap" id="currentDateBadge">
          Loading Date...
        </span>

        <div class="flex items-center space-x-1 bg-dark-emerald-light px-2 py-1 rounded-lg border border-dark-emerald">
          <span class="text-xs">🌐</span>
          <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-transparent text-white text-xs font-medium focus:outline-none cursor-pointer">
            <option value="en" class="bg-dark-emerald text-white" selected>English</option>
            <option value="ar" class="bg-dark-emerald text-white">العربية</option>
            <option value="ml" class="bg-dark-emerald text-white">മലയാളം</option>
            <option value="ur" class="bg-dark-emerald text-white">اردو</option>
            <option value="bn" class="bg-dark-emerald text-white">বাংলা</option>
          </select>
        </div>
      </div>

    </div>
  </header>

  <!-- Instruction Info Modal Popup (Triggered by ℹ️ Emoji) -->
  <div id="infoModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-5 shadow-2xl max-w-md w-full border border-slate-200 max-h-[85vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
        <h4 class="font-bold text-sm text-slate-800 flex items-center gap-1.5">
          <span>ℹ️</span> Instructions
        </h4>
        <button onclick="toggleInfoModal()" class="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
      </div>
      <p id="settingsInstruction" class="text-xs sm:text-sm text-slate-700 leading-relaxed font-medium">
        Use the Select button to configure the reciter, repetition count, Surah selection, and display mode.
      </p>
      <p id="zoomInstruction" class="mt-3 text-xs sm:text-sm text-slate-700 leading-relaxed font-medium"></p>
      <p id="updateInstruction" class="mt-3 text-xs sm:text-sm text-slate-700 leading-relaxed font-medium"></p>
      <div class="mt-4 pt-3 border-t border-slate-100 text-right">
        <button onclick="toggleInfoModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-1.5 rounded-xl text-xs font-semibold">
          Got it
        </button>
      </div>
    </div>
  </div>

  <!-- PWA Update Banner -->
  <div id="updateBanner" class="hidden fixed inset-x-3 z-[60] max-w-md mx-auto bg-white border border-emerald-300 rounded-2xl shadow-2xl p-4" style="bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);">
    <div class="flex items-start gap-3">
      <span class="text-2xl">🔄</span>
      <div class="flex-1 min-w-0">
        <p id="updTitle" class="font-bold text-sm text-emerald-900"></p>
        <p id="updMsg" class="text-xs text-slate-600 mt-0.5"></p>
        <ol id="updSteps" class="hidden list-decimal ps-5 mt-2 space-y-1 text-xs text-slate-700"></ol>
        <div class="flex flex-wrap items-center gap-2 mt-3">
          <button id="updNow" onclick="applyUpdate()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-xl text-xs font-semibold"></button>
          <button id="updLater" onclick="dismissUpdate()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-200"></button>
          <button id="updHow" onclick="$('updSteps').classList.toggle('hidden')" class="text-emerald-700 underline text-xs font-semibold"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Layout Container -->
  <div class="flex flex-col min-h-[calc(100vh-57px)] max-w-[1600px] mx-auto w-full shadow-2xl relative clip-x">
    
    <!-- Sliding Dropdown Settings Panel Sidebar -->
    <aside id="appSidebar" class="absolute inset-x-0 top-0 z-40 transform -translate-y-full transition-transform duration-300 ease-in-out w-full bg-dark-emerald text-emerald-50 p-4 border-b border-emerald-950 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="max-w-2xl mx-auto space-y-3">

        <!-- PWA Install Button -->
        <button id="btnInstallApp" onclick="installPWA()" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold py-2 px-3 rounded-lg flex items-center justify-center space-x-1.5 transition-all shadow-sm">
          <span>📱</span>
          <span>Install App</span>
        </button>
      
        <!-- Dropdown Controls & Form Inputs -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          
          <!-- Surah Selector Dropdown -->
          <div class="md:col-span-2">
            <label id="lblSurah" class="block text-[11px] font-semibold text-emerald-200 uppercase tracking-wider mb-1">
              Select Surah (السورة)
            </label>
            <div class="flex items-center space-x-2">
              <select id="surahSelect" onchange="onSurahChange()" class="w-full min-w-0 bg-dark-emerald-light border border-dark-emerald text-white text-xs rounded-lg p-2 focus:ring-2 focus:ring-emerald-400 focus:outline-none truncate">
                <!-- Dynamically populated -->
              </select>
              <span id="totalVersesBadge" class="text-xs bg-dark-emerald-light text-emerald-300 px-2 py-2 rounded-lg border border-dark-emerald font-semibold whitespace-nowrap shrink-0">
                -- Verses
              </span>
            </div>
          </div>

          <!-- Verse Range Picker -->
          <div>
            <label id="lblFromVerse" class="block text-[10px] font-semibold text-emerald-200 uppercase tracking-wider mb-1">
              From Verse (من آية)
            </label>
            <input type="number" id="fromVerse" value="1" min="1" onchange="validateAndFetchVerses()" class="w-full bg-dark-emerald-light border border-dark-emerald text-white text-xs rounded-lg p-2 focus:ring-2 focus:ring-emerald-400 focus:outline-none">
          </div>
          <div>
            <label id="lblToVerse" class="block text-[10px] font-semibold text-emerald-200 uppercase tracking-wider mb-1">
              To Verse (إلى آية)
            </label>
            <input type="number" id="toVerse" value="7" min="1" onchange="validateAndFetchVerses()" class="w-full bg-dark-emerald-light border border-dark-emerald text-white text-xs rounded-lg p-2 focus:ring-2 focus:ring-emerald-400 focus:outline-none">
          </div>

          <!-- Repetition Counter Target (Default 1) -->
          <div>
            <label id="lblRepetition" class="block text-[11px] font-semibold text-emerald-200 uppercase tracking-wider mb-1">
              Repetition Target (التكرار)
            </label>
            <div class="flex items-center space-x-2">
              <button onclick="adjustRepetition(-1)" class="bg-dark-emerald-light hover:bg-emerald-800 px-3 py-1.5 rounded-lg text-xs font-bold border border-dark-emerald text-emerald-200">-</button>
              <input type="number" id="repetitionTarget" value="1" min="1" oninput="onTargetChange()" class="w-full text-center bg-dark-emerald-light border border-dark-emerald text-white text-xs rounded-lg p-2 focus:outline-none">
              <button onclick="adjustRepetition(1)" class="bg-dark-emerald-light hover:bg-emerald-800 px-3 py-1.5 rounded-lg text-xs font-bold border border-dark-emerald text-emerald-200">+</button>
            </div>
          </div>

          <!-- Reciter Audio Picker -->
          <div>
            <label id="lblReciter" class="block text-[11px] font-semibold text-emerald-200 uppercase tracking-wider mb-1">
              Reciter (القارئ)
            </label>
            <select id="reciterSelect" onchange="onReciterChange()" class="w-full bg-dark-emerald-light border border-dark-emerald text-white text-xs rounded-lg p-2 focus:ring-2 focus:ring-emerald-400 focus:outline-none truncate">
              <option value="ar.husary">Mahmoud Khalil Al-Husary</option>
              <option value="ar.aymanswoaid">Dr. Ayman Sowaid</option>
              <option value="ar.alafasy">Mishary Rashid Alafasy</option>
              <option value="ar.abdurrahmaansudais">Abdur-Rahman As-Sudais</option>
              <option value="ar.mahermuaiqly">Maher Al Muaiqly</option>
              <option value="ar.minshawi">Mohamed Siddiq Al-Minshawi</option>
              <option value="Minshawy_Teacher_128kbps">Minshawi (Teacher / Repeat)</option>
              <option value="Husary_Muallim_128kbps"selected>Al-Husary (Muallim / Repeat)</option>
            </select>
          </div>

          <!-- Daily Page Wird Selector -->
          <div class="pt-2.5 border-t border-dark-emerald md:col-span-2">
            <label id="lblDailyWird" class="block text-[11px] font-semibold text-emerald-200 uppercase tracking-wider mb-1.5">
              Daily Page Range (الورد اليومي)
            </label>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <span id="lblFromPage" class="text-[10px] text-emerald-300 block mb-0.5">From Page</span>
                <input type="number" id="fromPage" value="1" min="1" max="604" onchange="onPageInputsChange()" onkeydown="if(event.key==='Enter')loadPageRange()" class="w-full bg-dark-emerald-light border border-dark-emerald text-white text-xs rounded-lg p-1.5 focus:outline-none">
              </div>
              <div>
                <span id="lblToPage" class="text-[10px] text-emerald-300 block mb-0.5">To Page</span>
                <input type="number" id="toPage" value="1" min="1" max="604" onchange="onPageInputsChange()" onkeydown="if(event.key==='Enter')loadPageRange()" class="w-full bg-dark-emerald-light border border-dark-emerald text-white text-xs rounded-lg p-1.5 focus:outline-none">
              </div>
