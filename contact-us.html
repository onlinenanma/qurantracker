<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Contact Us — Quran Learning App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bg-dark-emerald { background-color: #0d3322; }
    .bg-dark-emerald-light { background-color: #133e2b; }
    .border-dark-emerald { border-color: #1b5239; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-dark-emerald text-emerald-50 px-4 py-3 border-b border-emerald-950 z-30 shadow-md sticky top-0">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center space-x-2.5">
        <a href="./index.html" class="bg-dark-emerald-light p-2 rounded-xl text-emerald-300 border border-emerald-800/40 hover:bg-emerald-900 transition-all flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
        </a>
        <div>
          <h1 id="headerTitle" class="font-bold text-sm sm:text-base leading-tight text-white">Contact Us</h1>
          <p id="headerSub" class="text-[11px] text-emerald-300 font-medium">اتصل بنا</p>
        </div>
      </div>

      <span class="text-xs text-emerald-300 font-medium">Quran Learning App</span>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 p-4 md:p-8 max-w-lg mx-auto w-full flex items-center justify-center">
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 w-full">
      <h2 id="formHeading" class="font-bold text-lg text-emerald-900 mb-1 text-center">Contact Us</h2>
      <p id="formSubtitle" class="text-xs sm:text-sm text-slate-600 mb-6 text-center">
        We value your feedback. Please send us your suggestions and requirements.
      </p>
      
      <form action="https://api.web3forms.com/submit" method="POST" class="space-y-4">
        <input type="hidden" name="access_key" value="d89f4758-f018-454c-bde4-ac24b3d9006d">
        <input type="hidden" name="subject" value="New Requirement / Suggestion - Quran Learning App">
        <input type="hidden" name="redirect" value="https://quranlearning.app/index.html">

        <div>
          <label id="lblName" for="name" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Your Name</label>
          <input type="text" id="name" name="name" required placeholder="Enter your name" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs sm:text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <div>
          <label id="lblEmail" for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Your Email Address</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs sm:text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <div>
          <label id="lblMessage" for="message" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Suggestions & Requirements</label>
          <textarea id="message" name="message" required dir="auto" placeholder="Please share your suggestions, feature requests, or requirements here..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs sm:text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none h-32 resize-y"></textarea>
        </div>

        <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl text-xs sm:text-sm font-bold transition-all shadow-md">
          Send Message
        </button>
      </form>

      <div class="footer-note text-center mt-6 text-[11px] text-slate-400">
        &copy; 2026 quranlearning.app. All rights reserved.
      </div>
    </div>
  </main>

  <!-- Footer Back Link -->
  <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-200">
    <p><a href="./index.html" id="backHomeLink" class="text-emerald-600 hover:underline font-semibold">← Back to Quran Learning App</a></p>
  </footer>

  <script>
    const STORAGE_LANG_KEY = 'quran_hifz_lang';
    let currentLang = 'en';

    const translations = {
      en: {
        pageTitle: "Contact Us — Quran Learning App",
        headerTitle: "Contact Us",
        headerSub: "Get in touch with us",
        formHeading: "Contact Us",
        formSubtitle: "We value your feedback. Please send us your suggestions and requirements.",
        lblName: "Your Name",
        lblEmail: "Your Email Address",
        lblMessage: "Suggestions & Requirements",
        btnSubmit: "Send Message",
        backHomeLink: "← Back to Quran Learning App"
      },
      ar: {
        pageTitle: "اتصل بنا — تطبيق حفظ القرآن",
        headerTitle: "اتصل بنا",
        headerSub: "تواصل معنا",
        formHeading: "اتصل بنا",
        formSubtitle: "نحن نتقبل آرائكم باهتمام. يرجى إرسال مقترحاتكم ومتطلباتكم.",
        lblName: "اسمك",
        lblEmail: "عنوان بريدك الإلكتروني",
        lblMessage: "المقترحات والمتطلبات",
        btnSubmit: "إرسال الرسالة",
        backHomeLink: "← العودة إلى تطبيق القرآن"
      },
      ml: {
        pageTitle: "ബന്ധപ്പെടുക — Quran Learning App",
        headerTitle: "ബന്ധപ്പെടുക",
        headerSub: "ഞങ്ങളുമായി ബന്ധപ്പെടൂ",
        formHeading: "ഞങ്ങളെ ബന്ധപ്പെടുക",
        formSubtitle: "നിങ്ങളുടെ അഭിപ്രായങ്ങളും നിർദ്ദേശങ്ങളും ഞങ്ങൾക്ക് വളരെ വിലപ്പെട്ടതാണ്.",
        lblName: "നിങ്ങളുടെ പേര്",
        lblEmail: "ഇമെയിൽ വിലാസം",
        lblMessage: "നിർദ്ദേശങ്ങളും ആവശ്യങ്ങളും",
        btnSubmit: "സന്ദേശം അയക്കുക",
        backHomeLink: "← ഹോം പേജിലേക്ക് മടങ്ങുക"
      },
      ur: {
        pageTitle: "رابطہ کریں — قرآن لرننگ ایپ",
        headerTitle: "رابطہ کریں",
        headerSub: "ہم سے رابطہ کریں",
        formHeading: "ہم سے رابطہ کریں",
        formSubtitle: "ہم آپ کی رائے کی قدر کرتے ہیں۔ براہ کرم اپنے مشورے اور مطالبات ہمیں ارسال کریں۔",
        lblName: "آپ کا نام",
        lblEmail: "آپ کا ای میل پتہ",
        lblMessage: "تجویز اور مطالبات",
        btnSubmit: "پیغام بھیجیں",
        backHomeLink: "← واپس ہوم پیج پر جائیں"
      },
      bn: {
        pageTitle: "যোগাযোগ করুন — কুরআন লার্নিং অ্যাপ",
        headerTitle: "যোগাযোগ করুন",
        headerSub: "আমাদের সাথে যোগাযোগ করুন",
        formHeading: "যোগাযোগ করুন",
        formSubtitle: "আমরা আপনার মতামতের মূল্য দিই। আপনার পরামর্শ এবং প্রয়োজনীয়তা আমাদের পাঠান।",
        lblName: "আপনার নাম",
        lblEmail: "আপনার ইমেল ঠিকানা",
        lblMessage: "পরামর্শ এবং প্রয়োজনীয়তা",
        btnSubmit: "বার্তা পাঠান",
        backHomeLink: "← মূল পাতায় ফিরে যান"
      }
    };

    function applyLanguage() {
      const t = translations[currentLang] || translations.en;
      document.title = t.pageTitle;
      document.documentElement.lang = currentLang;
      document.documentElement.dir = (currentLang === 'ar' || currentLang === 'ur') ? 'rtl' : 'ltr';

      document.getElementById('headerTitle').textContent = t.headerTitle;
      document.getElementById('headerSub').textContent = t.headerSub;
      document.getElementById('formHeading').textContent = t.formHeading;
      document.getElementById('formSubtitle').textContent = t.formSubtitle;
      document.getElementById('lblName').textContent = t.lblName;
      document.getElementById('lblEmail').textContent = t.lblEmail;
      document.getElementById('lblMessage').textContent = t.lblMessage;
      document.getElementById('btnSubmit').textContent = t.btnSubmit;
      document.getElementById('backHomeLink').textContent = t.backHomeLink;
    }

    window.onload = function() {
      const savedLang = localStorage.getItem(STORAGE_LANG_KEY) || 'en';
      if (translations[savedLang]) {
        currentLang = savedLang;
      }
      applyLanguage();
    };
  </script>
</body>
</html>
