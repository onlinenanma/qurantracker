<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Quran Learning</title>
    <style>
        :root {
            --primary-color: #0d5c37;
            --secondary-color: #f4f6f8;
            --text-color: #333333;
            --border-color: #cccccc;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .contact-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #666666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #094428;
        }
        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #777777;
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <h1>Contact Us</h1>
        <p class="subtitle">We value your feedback. Please send us your suggestions and requirements.</p>

        <!-- Character Encoding Meta Tag (Mandatory for Arabic) -->
<meta charset="UTF-8">

<form action="https://api.web3forms.com/submit" method="POST" class="space-y-4">
    <!-- Get your free access key from web3forms.com (sent to appnanma@gmail.com) -->
    <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
    <input type="hidden" name="subject" value="New Requirement / Suggestion - Quran Learning App">

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Your Email</label>
        <input type="email" name="email" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500">
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Message / Requirements (അഭിപ്രായങ്ങൾ)</label>
        <textarea name="message" rows="5" required dir="auto" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500"></textarea>
    </div>

    <button type="submit" class="w-full bg-emerald-700 text-white font-medium py-2.5 rounded-lg hover:bg-emerald-800 transition">
        Send Message directly
    </button>
</form>

        <div class="footer-note">
            &copy; 2026 quranlearning.app. All rights reserved.
        </div>
    </div>

</body>
</html>
