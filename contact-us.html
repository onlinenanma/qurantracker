<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Quran Learning</title>
    <style>
        :root {
            --primary-color: #0d5c37;
            --secondary-color: #f4f6f8;
            --text-color: #333333;
            --border-color: #cccccc;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .contact-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #666666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #094428;
        }
        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #777777;
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <h1>Contact Us</h1>
        <p class="subtitle">We value your feedback. Please send us your suggestions and requirements.</p>
        
        <form action="https://api.web3forms.com/submit" method="POST">
            <!-- Replace with your actual Web3Forms access key -->
            <input type="hidden" name="access_key" value="d89f4758-f018-454c-bde4-ac24b3d9006d">
            <input type="hidden" name="subject" value="New Requirement / Suggestion - Quran Learning App">
            
            <!-- Custom Redirect URL to Home Page -->
            <input type="hidden" name="redirect" value="https://quranlearning.app/index.html">

            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Your Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="message">Suggestions & Requirements</label>
                <textarea id="message" name="message" required dir="auto" placeholder="Please share your suggestions, feature requests, or requirements here..."></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>

        <div class="footer-note">
            &copy; 2026 quranlearning.app. All rights reserved.
        </div>
    </div>

</body>
</html>
