<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Contact Us — Quran Learning App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bg-dark-emerald { background-color: #0d3322; }
    .bg-dark-emerald-light { background-color: #133e2b; }
    .border-dark-emerald { border-color: #1b5239; }
    /* Mirror the back arrow in right-to-left languages (Arabic, Urdu) */
    [dir="rtl"] .flip-rtl { transform: scaleX(-1); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-dark-emerald text-emerald-50 px-4 py-3 border-b border-emerald-950 z-30 shadow-md sticky top-0">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5">
        <a href="./index.html" aria-label="Back" class="bg-dark-emerald-light p-2 rounded-xl text-emerald-300 border border-emerald-800/40 hover:bg-emerald-900 transition-all flex items-center justify-center">
          <svg class="w-5 h-5 flip-rtl" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
        </a>
        <div>
          <h1 id="headerTitle" class="font-bold text-sm sm:text-base leading-tight text-white">Contact Us</h1>
          <p id="headerSub" class="text-[11px] text-emerald-300 font-medium">Get in touch with us</p>
        </div>
      </div>

      <span class="text-xs text-emerald-300 font-medium">Quran Learning App</span>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 p-4 md:p-8 max-w-lg mx-auto w-full flex items-center justify-center">
    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 w-full">
      <h2 id="formHeading" class="font-bold text-lg text-emerald-900 mb-1 text-center">Contact Us</h2>
      <p id="formSubtitle" class="text-xs sm:text-sm text-slate-600 mb-6 text-center">
        We value your feedback. Please send us your suggestions and requirements.
      </p>

      <form id="contactForm" action="https://api.web3forms.com/submit" method="POST" class="space-y-4">
        <input type="hidden" name="access_key" value="d89f4758-f018-454c-bde4-ac24b3d9006d">
        <input type="hidden" name="subject" value="New Requirement / Suggestion - Quran Learning App">
        <!-- Spam trap: real visitors never see or tick this (Web3Forms rejects the message if it is ticked) -->
        <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display:none">

        <div>
          <label id="lblName" for="name" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Your Name</label>
          <input type="text" id="name" name="name" required maxlength="100" autocomplete="name" placeholder="Enter your name" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs sm:text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <div>
          <label id="lblEmail" for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Your Email Address</label>
          <input type="email" id="email" name="email" required maxlength="150" autocomplete="email" dir="ltr" placeholder="Enter your email" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs sm:text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>

        <div>
          <label id="lblMessage" for="message" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Suggestions & Requirements</label>
          <textarea id="message" name="message" required maxlength="5000" dir="auto" placeholder="Please share your suggestions, feature requests, or requirements here..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs sm:text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none h-32 resize-y"></textarea>
        </div>

        <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-60 disabled:cursor-not-allowed text-white py-3 rounded-xl text-xs sm:text-sm font-bold transition-all shadow-md">
          Send Message
        </button>

        <!-- Result message (success / error) -->
        <div id="formStatus" role="status" aria-live="polite" class="hidden rounded-xl p-3 text-xs sm:text-sm font-medium text-center"></div>
      </form>

      <div id="footerCopy" class="footer-note text-center mt-6 text-[11px] text-slate-400">
        &copy; 2026 quranlearning.app. All rights reserved.
      </div>
    </div>
  </main>

  <!-- Footer Back Link -->
  <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-200">
    <p><a href="./index.html" id="backHomeLink" class="text-emerald-600 hover:underline font-semibold">← Back to Quran Learning App</a></p>
  </footer>

  <script>
    const STORAGE_LANG_KEY = 'quran_hifz_lang';
    let currentLang = 'en';

    const translations = {

        lblName: "നിങ്ങളുടെ പേര്",
        lblEmail: "ഇമെയിൽ വിലാസം",
        lblMessage: "നിർദ്ദേശങ്ങളും ആവശ്യങ്ങളും",
        phName: "നിങ്ങളുടെ പേര് നൽകുക",
        phEmail: "ഇമെയിൽ വിലാസം നൽകുക",
        phMessage: "നിങ്ങളുടെ നിർദ്ദേശങ്ങളോ പുതിയ ഫീച്ചർ ആവശ്യങ്ങളോ ഇവിടെ എഴുതുക...",
        btnSubmit: "സന്ദേശം അയക്കുക",
        sending: "അയക്കുന്നു...",
        success: "നന്ദി! നിങ്ങളുടെ സന്ദേശം അയച്ചു.",
        error: "ക്ഷമിക്കണം, സന്ദേശം അയക്കാനായില്ല. ദയവായി വീണ്ടും ശ്രമിക്കുക.",
        footerCopy: "© 2026 quranlearning.app. എല്ലാ അവകാശങ്ങളും നിക്ഷിപ്തം.",
        backHomeLink: "← ഹോം പേജിലേക്ക് മടങ്ങുക"
      },
      ur: {
        pageTitle: "رابطہ کریں — قرآن لرننگ ایپ",
        headerTitle: "رابطہ کریں",
        headerSub: "ہم سے رابطہ کریں",
        formHeading: "ہم سے رابطہ کریں",
        formSubtitle: "ہم آپ کی رائے کی قدر کرتے ہیں۔ براہ کرم اپنے مشورے اور مطالبات ہمیں ارسال کریں۔",
        lblName: "آپ کا نام",
        lblEmail: "آپ کا ای میل پتہ",
        lblMessage: "تجویز اور مطالبات",
        phName: "اپنا نام درج کریں",
        phEmail: "اپنا ای میل درج کریں",

        btnSubmit: "پیغام بھیجیں",
        sending: "بھیجا جا رہا ہے...",
        success: "شکریہ! آپ کا پیغام بھیج دیا گیا ہے۔",
        error: "معذرت، آپ کا پیغام نہیں بھیجا جا سکا۔ براہ کرم دوبارہ کوشش کریں۔",
        footerCopy: "© 2026 quranlearning.app۔ جملہ حقوق محفوظ ہیں۔",
        backHomeLink: "← واپس ہوم پیج پر جائیں"
      },
      bn: {
        pageTitle: "যোগাযোগ করুন — কুরআন লার্নিং অ্যাপ",
        headerTitle: "যোগাযোগ করুন",
        headerSub: "আমাদের সাথে যোগাযোগ করুন",
        formHeading: "যোগাযোগ করুন",
        formSubtitle: "আমরা আপনার মতামতের মূল্য দিই। আপনার পরামর্শ এবং প্রয়োজনীয়তা আমাদের পাঠান।",
        lblName: "আপনার নাম",
        lblEmail: "আপনার ইমেল ঠিকানা",
        lblMessage: "পরামর্শ এবং প্রয়োজনীয়তা",
        phName: "আপনার নাম লিখুন",
        phEmail: "আপনার ইমেল লিখুন",
        phMessage: "আপনার পরামর্শ, নতুন ফিচারের অনুরোধ বা প্রয়োজনীয়তা এখানে লিখুন...",
        btnSubmit: "বার্তা পাঠান",
        sending: "পাঠানো হচ্ছে...",
        success: "ধন্যবাদ! আপনার বার্তা পাঠানো হয়েছে।",
        error: "দুঃখিত, আপনার বার্তা পাঠানো যায়নি। অনুগ্রহ করে আবার চেষ্টা করুন।",
        footerCopy: "© 2026 quranlearning.app। সর্বস্বত্ব সংরক্ষিত।",
        backHomeLink: "← মূল পাতায় ফিরে যান"
      }
    };

    // Elements translated as plain text: the element id is also the key in `translations`.
    const TEXT_IDS = [
      'headerTitle', 'headerSub', 'formHeading', 'formSubtitle', 'lblName', 'lblEmail', 'lblMessage',
      'footerCopy', 'backHomeLink'
    ];
    // Placeholders: [element id, translation key]
    const PLACEHOLDERS = [['name', 'phName'], ['email', 'phEmail'], ['message', 'phMessage']];
    const RTL_LANGS = ['ar', 'ur'];
    const hasLang = code => typeof code === 'string' && Object.prototype.hasOwnProperty.call(translations, code);
    const $ = id => document.getElementById(id);

    let isSending = false;
    let statusKind = null; // 'success' | 'error' | null

    // The main app (index.html) stores the language with JSON.stringify, i.e. the value on disk is "ar"
    // WITH quotes. Read it as JSON first, and fall back to a plain string, so both formats work.
    function readSavedLang() {
      try {
        const raw = localStorage.getItem(STORAGE_LANG_KEY);
        if (!raw) return 'en';
        let val = raw;
        try { val = JSON.parse(raw); } catch (e) { /* plain string such as: ar */ }
        return hasLang(val) ? val : 'en';
      } catch (e) {
        return 'en'; // localStorage blocked (private mode / cookies disabled)
      }
    }

    function renderStatus() {
      const box = $('formStatus');
      if (!box) return;
      const t = translations[currentLang], fb = translations.en;
      box.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-red-50', 'text-red-700', 'border-red-200', 'border');
      if (!statusKind) { box.classList.add('hidden'); box.textContent = ''; return; }
      box.classList.add('border');
      if (statusKind === 'success') box.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-200');
      else box.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
      box.textContent = t[statusKind] !== undefined ? t[statusKind] : fb[statusKind];
    }

    function applyLanguage() {
      const t = translations[currentLang];
      const fb = translations.en;
      const pick = key => (t[key] !== undefined ? t[key] : fb[key]);
      document.title = pick('pageTitle');
      document.documentElement.lang = currentLang;
      document.documentElement.dir = RTL_LANGS.includes(currentLang) ? 'rtl' : 'ltr';
      TEXT_IDS.forEach(id => { const el = $(id); if (el) el.textContent = pick(id); });
      PLACEHOLDERS.forEach(([id, key]) => { const el = $(id); if (el) el.placeholder = pick(key); });
      const btn = $('btnSubmit');
      if (btn) btn.textContent = isSending ? pick('sending') : pick('btnSubmit');
      renderStatus();
    }

    function initLanguage() {
      currentLang = readSavedLang();
      applyLanguage();
    }

    // Send the form in the background so the visitor stays on this page and sees a confirmation
    // in their own language. If JavaScript fails to run, the plain HTML form still posts normally.
    async function submitForm(ev) {
      ev.preventDefault();
      if (isSending) return; // ignore double taps
      const form = ev.currentTarget;
      isSending = true;
      statusKind = null;
      $('btnSubmit').disabled = true;
      applyLanguage();
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(form)))
        });
        let data = {};
        try { data = await res.json(); } catch (e) { /* non-JSON reply */ }
        if (res.ok && data.success) { statusKind = 'success'; form.reset(); }
        else statusKind = 'error';
      } catch (e) {
        statusKind = 'error'; // offline or blocked
      }
      isSending = false;
      $('btnSubmit').disabled = false;
      applyLanguage();
    }

    // Script sits at the end of <body>, so the DOM is ready: apply right away (no flash of the wrong
    // language, and no waiting for the Tailwind CDN like window.onload would).
    initLanguage();
    $('contactForm').addEventListener('submit', submitForm);

    // If the language is changed in another tab/window of the app, follow it live.
    window.addEventListener('storage', e => {
      if (e.key === STORAGE_LANG_KEY || e.key === null) initLanguage();
    });
    // Restoring the page from the back/forward cache: re-read in case it changed meanwhile.
    window.addEventListener('pageshow', e => { if (e.persisted) initLanguage(); });
  </script>
</body>
</html>
