<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mus'haf Page View - Quran Learning App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-quran { font-family: 'Amiri', serif; }
    .bg-dark-emerald { background-color: #0d3322; }
    .bg-dark-emerald-light { background-color: #133e2b; }
    .border-dark-emerald { border-color: #1b5239; }

    .mushaf-page-frame {
      max-width: 650px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 2px solid #d4af37;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 1rem;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- Top Header -->
  <header class="bg-dark-emerald text-emerald-50 px-4 py-3 border-b border-emerald-950 z-30 shadow-md sticky top-0 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <h1 class="font-bold text-sm sm:text-base text-white">Mus'haf Page View (صفحات المصحف)</h1>
    </div>
    <div>
      <a href="./index.html" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">
        ← Back to Verses
      </a>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-4xl mx-auto p-4 md:p-6 w-full flex flex-col items-center">
    
    <!-- Page Controller Bar -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 w-full flex flex-wrap items-center justify-between gap-3 mb-6">
      <div class="flex items-center space-x-2">
        <button onclick="changePage(-1)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition-all">
          ← Previous
        </button>
        <div class="flex items-center space-x-1">
          <span class="text-xs text-slate-500 font-medium">Page:</span>
          <input type="number" id="pageNumberInput" value="1" min="1" max="604" onchange="loadMushafPage(this.value)" class="w-14 text-center bg-slate-50 border border-slate-200 rounded-lg p-1.5 text-xs font-bold focus:outline-none">
          <span class="text-xs text-slate-400">/ 604</span>
        </div>
        <button onclick="changePage(1)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition-all">
          Next →
        </button>
      </div>

      <!-- Mode Selector -->
      <div class="flex items-center space-x-2">
        <label class="text-xs text-slate-500 font-medium">Display:</label>
        <select id="mushafStyleSelect" onchange="switchMushafStyle(this.value)" class="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-lg p-2 focus:outline-none cursor-pointer">
          <option value="madinah_image" selected>Madinah Mus'haf (Exact Page Scan)</option>
          <option value="clean_text">Clean Responsive Text Mode</option>
        </select>
      </div>
    </div>

    <!-- Page Display Frame Container -->
    <div class="w-full">
      <div id="mushafContainer" class="mushaf-page-frame min-h-[550px] flex flex-col justify-between items-center">
        <div id="pageAyahsContent" class="w-full flex justify-center items-center"></div>
      </div>
    </div>

  </main>

  <script>
    let currentPage = 1;
    let currentStyle = 'madinah_image';

    function switchMushafStyle(style) {
      currentStyle = style;
      loadMushafPage(currentPage);
    }

    async function loadMushafPage(pageNum) {
      pageNum = parseInt(pageNum);
      if (isNaN(pageNum) || pageNum < 1) pageNum = 1;
      if (pageNum > 604) pageNum = 604;
      currentPage = pageNum;
      document.getElementById('pageNumberInput').value = currentPage;

      const container = document.getElementById('pageAyahsContent');
      container.innerHTML = '<div class="text-center text-slate-400 py-20">Loading page...</div>';

      // MODE 1: Madinah Mushaf High-Resolution Page Scan (Exact match)
      if (currentStyle === 'madinah_image') {
        const paddedNum = String(currentPage).padStart(3, '0');
        container.innerHTML = `
          <div class="flex justify-center items-center py-2 w-full">
            <img src="https://www.everyayah.com/data/images/img_${paddedNum}.png" 
                 alt="Madinah Mushaf Page ${currentPage}" 
                 class="max-h-[75vh] w-auto object-contain rounded-lg bg-white p-1"
                 onerror="this.onerror=null; this.src='https://verses.quran.com/pages/v1/page${paddedNum}.png';">
          </div>`;
      }
      // MODE 2: Clean Responsive Text Mode
      else {
        try {
          const res = await fetch(`https://api.alquran.cloud/v1/page/${currentPage}/quran-uthmani`);
          const data = await res.json();
          if (data.code === 200) {
            container.innerHTML = '';
            const textWrapper = document.createElement('div');
            textWrapper.className = 'w-full space-y-4 p-4';
            data.data.ayahs.forEach(ayah => {
              const p = document.createElement('div');
              p.className = 'text-right font-quran text-2xl md:text-3xl text-emerald-950 leading-loose border-b border-slate-100 pb-4';
              p.setAttribute('dir', 'rtl');
              p.innerHTML = `${ayah.text} <span class="text-sm font-sans text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-lg border border-emerald-200 inline-block mr-2">﴿${ayah.numberInSurah}﴾</span>`;
              textWrapper.appendChild(p);
            });
            container.appendChild(textWrapper);
          }
        } catch (err) {
          container.innerHTML = '<div class="text-center text-rose-500 py-20">Failed to load text. Please check connection.</div>';
        }
      }
    }

    function changePage(dir) {
      loadMushafPage(currentPage + dir);
    }

    window.onload = () => {
      loadMushafPage(1);
    };
  </script>
</body>
</html>
