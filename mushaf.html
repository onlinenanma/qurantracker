<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mus'haf Page View - Quran Learning App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-quran { font-family: 'Amiri', serif; }
    .bg-dark-emerald { background-color: #0d3322; }
    .bg-dark-emerald-light { background-color: #133e2b; }
    .border-dark-emerald { border-color: #1b5239; }

    .mushaf-page-frame {
      max-width: 650px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 2px solid #d4af37;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 1rem;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- Top Header with Quick Mode Toggle Emoji -->
  <header class="bg-dark-emerald text-emerald-50 px-4 py-3 border-b border-emerald-950 z-30 shadow-md sticky top-0 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <h1 class="font-bold text-sm sm:text-base text-white">Mus'haf Page View (صفحات المصحف)</h1>
    </div>
    
    <div class="flex items-center space-x-2">
      <!-- Quick Mode Switcher Emoji Toggle -->
      <button onclick="toggleAppMode()" title="Switch View Mode" class="bg-dark-emerald-light hover:bg-emerald-800 text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold border border-emerald-800/40 transition-all flex items-center space-x-1">
        <span id="modeToggleEmoji">📜</span>
        <span class="hidden sm:inline text-[11px]" id="modeToggleLabel">Verse Mode</span>
      </button>

      <a href="./index.html" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">
        ← Back to Verses
      </a>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-4xl mx-auto p-4 md:p-6 w-full flex flex-col items-center">
    
    <!-- Page Controller Bar -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 w-full flex flex-wrap items-center justify-between gap-3 mb-6">
      <div class="flex items-center space-x-2">
        <button onclick="changePage(-1)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition-all">
          ← Previous
        </button>
        <div class="flex items-center space-x-1">
          <span class="text-xs text-slate-500 font-medium">Page:</span>
          <input type="number" id="pageNumberInput" value="1" min="1" max="604" onchange="loadMushafPage(this.value)" class="w-14 text-center bg-slate-50 border border-slate-200 rounded-lg p-1.5 text-xs font-bold focus:outline-none">
          <span class="text-xs text-slate-400">/ 604</span>
        </div>
        <button onclick="changePage(1)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition-all">
          Next →
        </button>
      </div>

  

    <!-- Page Display Frame Container -->
    <div class="w-full">
      <div id="mushafContainer" class="mushaf-page-frame min-h-[550px] flex flex-col justify-between items-center relative">
        <div id="pageAyahsContent" class="w-full flex flex-col justify-center items-center"></div>
      </div>
    </div>

  </main>

  <!-- In-Tab Full Resolution Modal Overlay -->
  <div id="imageModal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col items-center justify-center p-4">
    <div class="relative max-w-5xl w-full h-full flex flex-col items-center justify-center">
      <button onclick="closeModal()" class="absolute top-4 right-4 bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-lg transition-all z-50">
        ✕ Close
      </button>
      <img id="modalImage" src="" alt="Full Resolution Page" class="max-h-[90vh] max-w-full object-contain rounded-lg shadow-2xl bg-white p-2">
    </div>
  </div>

  <script>
    let currentPage = 1;
    let currentStyle = 'madinah_image';

    function toggleAppMode() {
      // Switches back to index.html (Verse Mode) when emoji toggle is clicked
      window.location.href = './index.html';
    }

    function switchMushafStyle(style) {
      currentStyle = style;
      loadMushafPage(currentPage);
    }

    async function loadMushafPage(pageNum) {
      pageNum = parseInt(pageNum);
      if (isNaN(pageNum) || pageNum < 1) pageNum = 1;
      if (pageNum > 604) pageNum = 604;
      currentPage = pageNum;
      document.getElementById('pageNumberInput').value = currentPage;

      const container = document.getElementById('pageAyahsContent');
      container.innerHTML = '<div class="text-center text-slate-400 py-20">Loading page...</div>';

      // MODE 1: Madinah Mushaf High-Resolution Scan from quran.app
      if (currentStyle === 'madinah_image') {
        const paddedNum = String(currentPage).padStart(3, '0'); // e.g., "001", "025", "604"
        const imgUrl = `https://files.quran.app/hafs/madani/width_1024/page${paddedNum}.png`;
        
        container.innerHTML = `
          <div class="flex flex-col justify-center items-center py-2 w-full cursor-pointer group relative" onclick="openModal('${imgUrl}')">
            <img src="${imgUrl}" 
                 alt="Madinah Mushaf Page ${currentPage}" 
                 class="max-h-[75vh] w-auto object-contain rounded-lg bg-white p-1 transition-transform group-hover:scale-[1.01]"
                 onerror="this.onerror=null; this.src='https://www.everyayah.com/data/images/img_${paddedNum}.png';">
            <span class="text-[11px] text-slate-400 mt-2 bg-slate-50 px-3 py-1 rounded-full border border-slate-200">🔍 Click image for full resolution view</span>
          </div>`;
      }
      // MODE 2: Clean Responsive Text Mode
      else {
        try {
          const res = await fetch(`https://api.alquran.cloud/v1/page/${currentPage}/quran-uthmani`);
          const data = await res.json();
          if (data.code === 200) {
            container.innerHTML = '';
            const textWrapper = document.createElement('div');
            textWrapper.className = 'w-full space-y-4 p-4';
            data.data.ayahs.forEach(ayah => {
              const p = document.createElement('div');
              p.className = 'text-right font-quran text-2xl md:text-3xl text-emerald-950 leading-loose border-b border-slate-100 pb-4';
              p.setAttribute('dir', 'rtl');
              p.innerHTML = `${ayah.text} <span class="text-sm font-sans text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-lg border border-emerald-200 inline-block mr-2">﴿${ayah.numberInSurah}﴾</span>`;
              textWrapper.appendChild(p);
            });
            container.appendChild(textWrapper);
          }
        } catch (err) {
          container.innerHTML = '<div class="text-center text-rose-500 py-20">Failed to load text. Please check connection.</div>';
        }
      }
    }

    function openModal(url) {
      document.getElementById('modalImage').src = url;
      document.getElementById('imageModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('imageModal').classList.add('hidden');
      document.getElementById('modalImage').src = '';
    }

    function changePage(dir) {
      loadMushafPage(currentPage + dir);
    }

    window.onload = () => {
      loadMushafPage(1);
    };
  </script>
</body>
</html>
